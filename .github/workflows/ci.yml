name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app uses previz, a private library not on npm. With a read token it is cloned and
      # unpacked into vendor/ (never committed); without one, only the library is checked here and
      # the app is gated by the local CI run (see the manual-task issue about PREVIZ_READ_TOKEN).
      - name: Get previz (private)
        id: previz
        env:
          PREVIZ_READ_TOKEN: ${{ secrets.PREVIZ_READ_TOKEN }}
        run: |
          if [ -z "$PREVIZ_READ_TOKEN" ]; then
            echo "::notice::PREVIZ_READ_TOKEN is not set: checking the library only; the app is gated by local CI."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pinned to the previz commit this app is written against (v0.1.0); bump with scripts/vendor-previz.mjs.
          git clone "https://x-access-token:${PREVIZ_READ_TOKEN}@github.com/thorwhalen/previz.git" ../previz
          git -C ../previz checkout --quiet b039296
          (cd ../previz && npx --yes pnpm@11 install && npx --yes pnpm@11 build)
          node scripts/vendor-previz.mjs
          echo "available=true" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter shaping typecheck
      - run: pnpm --filter shaping test
      - run: pnpm build:lib
      - if: steps.previz.outputs.available == 'true'
        run: pnpm --filter shaping-app typecheck && pnpm --filter shaping-app test && pnpm --filter shaping-app build
      # The v1 acceptance test: one command writes a 3MF that re-reads as a closed mesh.
      - run: pnpm shaping build examples/triplet.json --format 3mf --out "$RUNNER_TEMP/triplet.3mf"
      - run: pnpm shaping check examples/triplet.json

  publish:
    # Merging to main publishes the library when its version is not yet on npm.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - name: Publish if this version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/shaping/package.json').version")
          if npm view "shaping@$VERSION" version >/dev/null 2>&1; then
            echo "shaping@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository, so shaping@$VERSION cannot be published."
            exit 1
          fi
          cd packages/shaping
          pnpm publish --access public --no-git-checks
      - name: Verify the registry serves this version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/shaping/package.json').version")
          for i in 1 2 3 4 5 6; do
            if npm view "shaping@$VERSION" version >/dev/null 2>&1; then echo "npm serves shaping@$VERSION"; exit 0; fi
            sleep 10
          done
          echo "::error::npm does not serve shaping@$VERSION after publishing"; exit 1
